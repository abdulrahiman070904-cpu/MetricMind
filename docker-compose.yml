services:
  cube:
    image: cubejs/cube:latest
    container_name: metricmind_cube
    ports:
      - "4000:4000"
    environment:
      CUBEJS_DEV_MODE: "${CUBEJS_DEV_MODE:-true}"
      CUBEJS_API_SECRET: "${CUBEJS_API_SECRET}"
      CUBEJS_DB_TYPE: "${CUBEJS_DB_TYPE:-snowflake}"
      CUBEJS_DB_USER: "${CUBEJS_DB_USER}"
      CUBEJS_DB_PASS: "${CUBEJS_DB_PASS}"
      CUBEJS_DB_NAME: "${CUBEJS_DB_NAME}"
      CUBEJS_DB_SNOWFLAKE_ACCOUNT: "${CUBEJS_DB_SNOWFLAKE_ACCOUNT}"
      CUBEJS_DB_SNOWFLAKE_REGION: "${CUBEJS_DB_SNOWFLAKE_REGION}"
      CUBEJS_DB_SNOWFLAKE_SCHEMA: "${CUBEJS_DB_SNOWFLAKE_SCHEMA:-ANALYTICS}"
      CUBEJS_DB_SNOWFLAKE_WAREHOUSE: "${CUBEJS_DB_SNOWFLAKE_WAREHOUSE}"
      CUBEJS_DB_SNOWFLAKE_ROLE: "${CUBEJS_DB_SNOWFLAKE_ROLE}"
    volumes:
      - .:/cube/conf
